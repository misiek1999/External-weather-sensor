# GPIO i I2C
CONFIG_GPIO=y
CONFIG_I2C=y

# ADC
CONFIG_ADC=y

# Bluetooth LE - only broadcaster mode, no observer, peripheral or central
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=n
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_SMP=n
CONFIG_BT_DEVICE_NAME="WeatherStation"

# Power Management
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# UART
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Disable boot info
CONFIG_BOOT_BANNER=n

# Flash for nRF52840 UF2 bootloader
CONFIG_FLASH_LOAD_OFFSET=0x26000
