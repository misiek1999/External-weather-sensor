# Debug overlay for easy diagnostics on top of zephyr/prj.conf
# Use with PlatformIO environment: nice_nano_v2_debug or nice_nano_v2_dfu_debug

# Console / printk
CONFIG_STDOUT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Optional Zephyr logging subsystem (kept modest by default)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
